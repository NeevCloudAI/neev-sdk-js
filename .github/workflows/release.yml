# SDK release — deliberately manual. Nothing publishes on a push to main.
# Mirrors the backend's tag-driven release convention (on: push tags 'v*')
# plus a manual workflow_dispatch. A publish only happens when someone pushes a
# version tag or runs this workflow by hand.
#
# Authentication is npm trusted publishing: npm exchanges this workflow's OIDC
# identity for a short-lived token, so there is no stored secret. That means the
# package's trusted publisher on npmjs.com must name this repo AND this workflow
# file — rename the file and the next release fails to authenticate.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges to authenticate the publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing landed in npm 11.5.1; the npm bundled with Node 22 is
      # older than that, so the publish would fall back to looking for a token.
      - name: Install an npm with trusted publishing support
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # setup-node's registry-url writes an .npmrc containing
      # `_authToken=${NODE_AUTH_TOKEN}` and exports a placeholder value for that
      # variable, so npm still sees a configured credential even though no secret
      # is passed. Strip the line so the OIDC exchange is the only way this job
      # can authenticate, and fail loudly if it survives.
      - name: Leave OIDC as the only credential
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            if grep -q '_authToken' "$npmrc"; then
              echo "::error::_authToken still configured in $npmrc; refusing to publish"
              exit 1
            fi
          fi
      # NODE_AUTH_TOKEN is emptied as well: npm reads it directly, not only via
      # the .npmrc line removed above.
      - name: Build and publish to npm
        run: pnpm release:publish
        env:
          NODE_AUTH_TOKEN: ""
