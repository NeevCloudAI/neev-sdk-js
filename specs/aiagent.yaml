        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "425": {$ref: '#/components/responses/TooEarly'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/agents/{agent_id}/restore:
    post:
      tags: [Agents]
      summary: Restore an agent from a snapshot
      description: |
        Restarts the agent's backing sandbox from a previously taken snapshot.
      operationId: restoreAgent
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/AgentID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id]
              properties:
                snapshot_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Agent restarting from snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  # --- Agent Templates ---
  /api/v1beta1/agent-templates:
    get:
      tags: [Agent Templates]
      summary: List agent templates
      description: |
        Returns platform-managed agent templates available for agent create.
        Only templates with status `active` are returned. Internal template
        details are not exposed.
      operationId: listAgentTemplates
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const page = await neev.agentTemplates.list();
            console.log(page.items.map((t) => t.name));
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            page = neev.agent_templates.list()
            print([t.name for t in page.items])
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200":
          description: Paginated list of agent templates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTemplateListResponse'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/agent-templates/{template_id}:
    get:
      tags: [Agent Templates]
      summary: Get an agent template
      description: |
        Returns one platform-managed agent template by id (e.g. `ag-claude-code`).
        Use the template `name` at agent create.
      operationId: getAgentTemplate
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const template = await neev.agentTemplates.get("ag-claude-code");
            console.log(template.name);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            template = neev.agent_templates.get("ag-claude-code")
            print(template.name)
      parameters:
        - {$ref: '#/components/parameters/AgentTemplateID'}
      responses:
        "200":
          description: Agent template details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTemplate'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgID:
      name: org_id
      in: path
      required: true
      description: Organization identifier.
      schema: {type: string}
    ProjectID:
      name: project_id
      in: path
      required: true
      description: Project identifier.
      schema: {type: string}
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      description: Sandbox UUID.
      schema: {type: string, format: uuid}
    SnapshotID:
      name: snapshot_id
      in: path
      required: true
      description: Snapshot UUID.
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    SandboxTemplateID:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^sb-[a-zA-Z0-9-]+$'
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    SandboxNameSearch:
      name: name
      in: query
      required: false
      description: Case-insensitive substring match on the sandbox name.
      schema: {type: string, maxLength: 63}
    SandboxIDFilter:
      name: sandbox_id
      in: query
      required: false
      description: Filter to a single sandbox by its id.
      schema: {type: string, format: uuid}
    AgentID:
      name: agent_id
      in: path
      required: true
      description: Agent UUID.
      schema: {type: string, format: uuid}
    AgentTemplateID:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ag-[a-zA-Z0-9-]+$'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooEarly:
      description: Resource not ready yet; retry later
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}
        details: {type: string}
    EnvVar:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: string}
    SandboxPhase:
      type: string
      enum: [Pending, Ready, NotReady, Unknown, Pausing, Paused, RestoreFailed]
    SandboxResources:
      type: object
      description: |
        Sandbox compute size. Omitted fields use the platform default.
      properties:
        cpu:
          type: number
          minimum: 0.5
          maximum: 8
          multipleOf: 0.5
          example: 1
          description: vCPUs. Multiples of 0.5, from 0.5 to 8.
        memory_gb:
          type: integer
          minimum: 1
          maximum: 16
          example: 2
          description: Memory in GB, from 1 to 16.
        disk_gb:
          type: integer
          minimum: 10
          maximum: 100
          multipleOf: 10
          example: 10
          description: Ephemeral disk in GB. Multiples of 10, from 10 to 100.
        rootfs_disk_gb:
          type: integer
          minimum: 1
          maximum: 99
          example: 4
          description: |
            Portion of disk_gb reserved for the container filesystem; the rest
            is available to /workspace. Raise it when installs write outside
            /workspace. Must be less than disk_gb. Defaults to 20% of disk_gb,
            minimum 4. Can only be set when the sandbox is created.
    Sandbox:
      type: object
      required: [id, org_id, project_id, name, region, image, phase, replicas, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        org_id: {type: string}
        project_id: {type: string}
        name: {type: string}
        region: {type: string, description: "Region where the sandbox runs.", example: "dev"}
        image: {type: string}
        command: {type: array, items: {type: string}}
        resources: {$ref: '#/components/schemas/SandboxResources'}
        phase: {$ref: '#/components/schemas/SandboxPhase'}
        connect_url: {type: string, nullable: true, description: "Public URL the SDK calls (API key + X-Sandbox-Id). null when not configured."}
        preview_url_template: {type: string, nullable: true, description: "Template for a public preview URL with {port} left for getUrl({port}) to fill client-side. null when not configured."}
        replicas: {type: integer, minimum: 0, maximum: 1, description: "0 = paused, 1 = running."}
        egress:
          allOf:
            - $ref: '#/components/schemas/SandboxEgressConfig'
          nullable: true
        sandbox_template_id:
          type: string
          nullable: true
          description: Catalogue template id from create when one was provided; null otherwise.
        created_by:
          type: string
          nullable: true
          description: Identity that created the sandbox (user id, or API key id for key-authenticated calls); null for sandboxes created before this was recorded.
        last_crash:
          allOf:
            - $ref: '#/components/schemas/SandboxLastCrash'
          nullable: true
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        idle_timeout_seconds: {type: integer, nullable: true, description: "Idle window in seconds; 0 when the sandbox has no idle limit, null when using the account default."}
        max_lifetime_seconds: {type: integer, nullable: true, description: "Maximum lifetime in seconds; 0 when the sandbox has no lifetime limit, null when using the account default."}
        paused_retention_seconds: {type: integer, nullable: true, description: "Seconds a paused sandbox is kept before deletion; 0 to keep it paused indefinitely, null when using the account default."}
        on_idle: {$ref: '#/components/schemas/OnIdleAction'}
        idle_expires_at: {type: string, format: date-time, nullable: true, description: "When the sandbox will be stopped if it stays idle until then; null when no idle limit applies to it."}
        hard_expires_at: {type: string, format: date-time, nullable: true, description: "When the sandbox will be stopped regardless of activity; null when no lifetime limit applies to it."}
    OnIdleAction:
      type: string
      enum: [pause, delete]
      default: pause
      description: |
        What happens when a sandbox becomes idle or reaches its maximum
        lifetime. pause stops it but keeps its state so it can be resumed;
        delete removes the sandbox and its data.
    SandboxLifecycle:
      type: object
      description: Optional idle and lifetime controls set at create time.
      properties:
        idle_timeout_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Automatically act on the sandbox after this many seconds without activity. Omit to use the account default, or send 0 for no idle limit.
        max_lifetime_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Automatically act on the sandbox this many seconds after it is created, regardless of activity. Omit to use the account default, or send 0 for no lifetime limit.
        paused_retention_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Delete the sandbox once it has stayed paused for this many seconds. Omit to use the account default, or send 0 to keep it paused indefinitely.
        on_idle: {$ref: '#/components/schemas/OnIdleAction'}
    UpdateSandboxTimeoutRequest:
      type: object
      description: >-
        Change the idle and lifetime windows on a running sandbox. Omitted
        fields are left unchanged. Send 0 to turn a window off, so the sandbox
        is not subject to that limit at all.
      properties:
        idle_timeout_seconds: {type: integer, minimum: 0, nullable: true}
        max_lifetime_seconds: {type: integer, minimum: 0, nullable: true}
        paused_retention_seconds: {type: integer, minimum: 0, nullable: true}
        on_idle: {$ref: '#/components/schemas/OnIdleAction'}
    SandboxLastCrash:
      type: object
      description: |
        The most recent unexpected stop of the sandbox, or null if it has never
        had one. It records a past event and is not cleared when the sandbox
        recovers or is restored, so read `at` before acting on it; storage_reset
        says whether the sandbox's files survived that stop.
      required: [reason, at, storage_reset]
      properties:
        reason: {type: string, description: "Why the sandbox stopped.", example: "OOMKilled"}
        at: {type: string, format: date-time, description: "When the stop was detected."}
        storage_reset:
          type: boolean
          description: |
            True when the sandbox restarted with an empty filesystem: files
            under /workspace, and anything installed since create, are gone.
            False when it restarted with its files intact.
    CreateSandboxRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          x-go-type-skip-optional-pointer: true
          description: |
            Sandbox name. Optional — when omitted, the server generates one (a
            "sandbox-" prefix plus a short random suffix). When provided, must be
            a valid DNS name: lowercase alphanumeric characters or '-', starting
            with a letter, ending with an alphanumeric, max 63 characters.
          example: my-sandbox
        region: {type: string, description: "Region to provision in; omit to use the platform default.", example: "dev"}
        env: {type: array, items: {$ref: '#/components/schemas/EnvVar'}}
        resources: {$ref: '#/components/schemas/SandboxResources'}
        egress: {$ref: '#/components/schemas/SandboxEgressConfig'}
        sandbox_template_id:
          type: string
          minLength: 1
          pattern: '^sb-[a-zA-Z0-9-]+$'
          description: Catalogue template id. Mutually exclusive with `image`.
        image:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^/@\s]+(/[^/@\s]+)+(:[^/@\s]+|@sha256:[a-fA-F0-9]+)$'
          description: Public OCI image reference with an explicit tag or digest. Mutually exclusive with `sandbox_template_id`. Subject to a 3 GB maximum image size.
          example: harbor.neev.work/neevcloudai-staging/ubuntu-26.04-minimal:v2026.03.1
        command:
          type: array
          items: {type: string}
          description: Optional container command for BYOI creates; defaults to sleep infinity when omitted.
          example: ["sleep", "infinity"]
        restore:
          type: string
          format: uuid
          nullable: true
          description: |
            When set, the new sandbox is restored from this snapshot instead of
            cold-starting from the image. Snapshot must belong to the same
            project. Sizing and region must match the snapshot's origin. Must
            not be combined with `image`.
        from_snapshot:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: |
            Deprecated alias for `restore`. Snapshot ID to restore from.
        lifecycle: {$ref: '#/components/schemas/SandboxLifecycle'}
      oneOf:
        - required: [sandbox_template_id]
        - required: [image]
        - required: [restore]
        - required: [from_snapshot]
        # Omit all four to use the platform default catalogue template (when configured).
        - not:
            anyOf:
              - required: [sandbox_template_id]
              - required: [image]
              - required: [restore]
              - required: [from_snapshot]
    ExposePortRequest:
      type: object
      required: [port]
      properties:
        port: {type: integer, minimum: 1, maximum: 65535, description: "User port to expose for preview URLs."}
    SandboxPort:
      type: object
      required: [port, preview_url]
      properties:
        port: {type: integer, description: "The exposed user port."}
        preview_url: {type: string, description: "Public credential-free preview URL for this port."}
    SandboxPortList:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          items: {$ref: '#/components/schemas/SandboxPort'}
    UpdateSandboxRequest:
      type: object
      additionalProperties: false
      description: |
        Request to update a running sandbox's CPU/memory and/or egress rules.
        At least one of `resources` or `egress` must be provided.
      properties:
        resources:
          allOf:
            - $ref: '#/components/schemas/SandboxResources'
          description: |
            New cpu/memory sizing, resized in place on the running sandbox. Only
            the fields provided change. disk_gb is not resizable in place and is
            rejected if supplied with a different value.
        egress:
          allOf:
            - $ref: '#/components/schemas/SandboxEgressConfig'
          description: |
            New egress policy for the sandbox. Replaces the existing policy in
            full and takes effect immediately for new connections — no sandbox
            restart is required.
    PauseSandboxRequest:
      type: object
      description: Optional body for the pause endpoint.
    # --- Snapshot schemas ---
    SnapshotStatus:
      type: string
      description: Lifecycle phase of a snapshot.
      enum: [Pending, Running, Ready, Failed]
    SnapshotType:
      type: string
      description: Type of the snapshot.
      enum: [full]
    SnapshotRestorability:
      type: string
      description: |
        Whether this snapshot can be restored. `restorable`: fully supported.
        `deprecating`: still restorable but on the way out (re-snapshot to stay
        current). `unsupported`: a restore will be refused.
      enum: [restorable, deprecating, unsupported]
    Snapshot:
      type: object
      required: [id, sandbox_id, org_id, project_id, status, snapshot_type, source_region, created_at, updated_at, sandbox_format_version, restorability]
      description: Metadata for a sandbox memory+filesystem snapshot.
      properties:
        id: {type: string, format: uuid, description: Snapshot UUID.}
        sandbox_id: {type: string, format: uuid, description: UUID of the source sandbox.}
        org_id: {type: string}
        project_id: {type: string}
        name: {type: string, description: Optional customer-supplied name.}
        status: {$ref: '#/components/schemas/SnapshotStatus'}
        snapshot_type: {$ref: '#/components/schemas/SnapshotType'}
        source_region: {type: string, description: Region where the snapshot is stored.}
        size_bytes:
          type: integer
          format: int64
          nullable: true
          description: Uncompressed snapshot size in bytes. Null until status=Ready.
        error_message:
          type: string
          nullable: true
          description: Human-readable reason the snapshot failed, safe to show to end users. Null unless status=Failed.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the platform will GC this snapshot. Null = no expiry.
        created_by:
          type: string
          nullable: true
          description: Identity that created the snapshot (user email, or "system" for system-initiated snapshots like pause/fork).
        sandbox_format_version:
          type: integer
          description: Version of the format used to record this snapshot's captured configuration. 0 for snapshots taken before it was recorded.
        restorability: {$ref: '#/components/schemas/SnapshotRestorability'}
        build_descriptor:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            The configuration this snapshot was captured with, recorded so the
            snapshot can be restored consistently. Null for snapshots taken
            before it was recorded.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SnapshotListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Snapshot'}}
        total: {type: integer}
        page: {type: integer}
        limit: {type: integer}
    CreateSnapshotRequest:
      type: object
      description: Optional body for POST .../snapshots.
      properties:
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          description: |
            Optional name for this snapshot. Must be a valid DNS name (lowercase
            alphanumeric or '-', starting with a letter, max 63 characters) so it
            can name sandboxes created on fork and restore. Omit to leave
            unnamed.
    RollbackSandboxRequest:
      type: object
      required: [snapshot_id]
      description: Body for POST .../sandboxes/{id}/rollback.
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: |
            UUID of the snapshot to restore from. Must belong to this sandbox or
            another sandbox in the same project.
    RestoreSandboxRequest:
      type: object
      required: [snapshot_id]
      deprecated: true
      description: Deprecated body for POST .../sandboxes/{id}/restore (use RollbackSandboxRequest).
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: |
            UUID of the snapshot to restore from. Must belong to this sandbox or
            another sandbox in the same project.
    ForkSandboxRequest:
      type: object
      required: [name]
      description: Body for POST .../sandboxes/{id}/fork.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          description: |
            Name for the new forked sandbox. Must be unique within the project,
            and a valid DNS name: lowercase alphanumeric characters or '-',
            starting with a letter, ending with an alphanumeric, max 63
            characters.
    SandboxEgressConfig:
      type: object
      description: Network egress configuration rules for the sandbox.
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [deny_all, allow_list]
          default: deny_all
          description: The egress mode. deny_all blocks all egress. allow_list restricts egress to the specified allowed destinations.
        allow_internet:
          type: boolean
          description: "Escape hatch: if true, allows 0.0.0.0/0 (the entire internet). Strictly audit-logged."
          default: false
        allow:
          type: array
          description: List of egress rules for host/IP destinations to allow.
          items: {$ref: '#/components/schemas/SandboxEgressRule'}
    SandboxEgressRule:
      type: object
      description: Individual egress rule specifying allowed destination host.
      additionalProperties: false
      required: [host]
      properties:
        host: {type: string, description: "IP address, CIDR block, or domain name"}
        ports: {type: array, items: {type: integer}}
        protocol: {type: string, enum: [TCP, UDP]}
    SandboxListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Sandbox'}}
        total: {type: integer}
        page: {type: integer}
        limit: {type: integer}
    SandboxTemplateCategory:
      type: string
      enum: [standard, browser]
    SandboxTemplateStatus:
      type: string
      enum: [active, deprecated, disabled]
    SandboxTemplate:
      type: object
      required: [id, name, description, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^sb-[a-zA-Z0-9-]+$'
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/SandboxTemplateCategory'
        status:
          $ref: '#/components/schemas/SandboxTemplateStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SandboxTemplateListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SandboxTemplate'}
        total: {type: integer}
        page: {type: integer}
        limit: {type: integer}
    MetricSeries:
      type: object
      required: [metric, points]
      properties:
        metric:
          type: string
          description: Stable metric key from the v1 catalogue (e.g. "cpu_usage_cores", "memory_usage_bytes").
        unit:
          type: string
          description: Unit of the values (e.g. "cores", "bytes", "count", "ratio").
        points:
          type: array
          description: Time-ordered [unix_seconds, value] pairs. Empty when the sandbox emitted no samples in the window.
          items:
            type: array
            items: {type: number, format: double}
    ConnectTokenResponse:
      type: object
      required: [token, expires_in]
      properties:
        token: {type: string, description: "Signed connect token, presented as a bearer credential when calling the sandbox directly."}
        expires_in: {type: integer, description: "Token lifetime in seconds."}
    SandboxMetricsResponse:
      type: object
      required: [sandbox_id, from, to, step, series]
      properties:
        sandbox_id: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        step: {type: string, description: "Resolution actually used after server-side clamping."}
        series: {type: array, items: {$ref: '#/components/schemas/MetricSeries'}}
    # --- Agent schemas ---
    AgentStatus:
      type: string
      description: Lifecycle state of an agent, derived from its backing sandbox.
      enum: [Provisioning, Ready, Pausing, Paused, Failed, Deleting]
    Agent:
      type: object
      required: [id, org_id, project_id, name, agent_template_id, sandbox_id, status, drive_mode, metrics_url, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        org_id: {type: string}
        project_id: {type: string}
        name: {type: string}
        agent_template_id:
          type: string
          description: Catalogue template id the agent was created from (e.g. ag-claude-code).
        drive_mode: {$ref: '#/components/schemas/DriveMode'}
        sandbox_id:
          type: string
          format: uuid
          description: UUID of the backing sandbox that runs this agent.
        config:
          type: object
          additionalProperties: true
          description: Effective agent configuration (template defaults merged with create-time overrides).
        status: {$ref: '#/components/schemas/AgentStatus'}
        web_ui_url:
          type: string
          nullable: true
          description: |
            Public URL of the agent's own web UI, reached directly. Present only
            for web agents (drive_mode http with a declared UI port); null
            otherwise.
        metrics_url:
          type: string
          description: |
            API path for the sandbox's live health metrics (the
            getSandboxMetrics endpoint), relative to this API's base URL.
        gateway_token:
          type: string
          nullable: true
          description: |
            Token the agent's web UI uses to authenticate. Present only for web
            agents that gate the UI on a token; null otherwise.
        last_crash:
          allOf:
            - $ref: '#/components/schemas/AgentLastCrash'
          nullable: true
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        egress: {$ref: '#/components/schemas/SandboxEgressConfig'}
    AgentLastCrash:
      type: object
      description: |
        The most recent unexpected stop of the agent, or null if it has never
        had one. It records a past event and is not cleared when the agent
        recovers or is restored, so read `at` before acting on it; storage_reset
        says whether the agent's files survived that stop.
      required: [reason, at, storage_reset]
      properties:
        reason: {type: string, description: "Why the agent stopped.", example: "OOMKilled"}
        at: {type: string, format: date-time, description: "When the stop was detected."}
        storage_reset:
          type: boolean
          description: |
            True when the agent restarted with an empty filesystem: files under
            /workspace, and anything installed since create, are gone. False
            when it restarted with its files intact.
    DriveMode:
      type: string
      description: |
        How a client drives the agent — `http` proxies to the agent's own HTTP
        port, `exec` runs a command, `pty` attaches an interactive terminal.
        Derived from the agent template's declared mode. Pair it with a ticket
        from `POST /agents/{agent_id}/connect` to reach the agent.
      enum: [http, exec, pty]
    AgentConnectResponse:
      type: object
      required: [connect_url, token, expires_at]
      properties:
        connect_url:
          type: string
          description: Direct address the client calls to reach the agent.
        token:
          type: string
          description: |
            Short-lived connect token, bound to this project and agent,
            presented as a bearer credential when calling the agent directly.
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry of the ticket.
    CreateAgentRequest:
      type: object
      required: [name, agent_template]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          description: |
            Agent name. Must be a valid DNS name: lowercase alphanumeric
            characters or '-', starting with a letter, ending with an
            alphanumeric, max 63 characters.
          example: my-agent
        agent_template:
          type: string
          minLength: 1
          description: |
            Catalogue template name (e.g. claude-code). The server validates the
            template exists and is active, then provisions the agent from it.
          example: claude-code
        region:
          type: string
          description: Region to provision the backing sandbox in; omit to use the platform default.
          example: dev
        config:
          type: object
          additionalProperties: true
          description: |
            Agent configuration overrides, shallow-merged over the template's
            default_config. Shape is template-specific (see template
            config_schema).
        env:
          type: array
          items: {$ref: '#/components/schemas/EnvVar'}
          description: Environment variables injected into the agent container.
        resources: {$ref: '#/components/schemas/SandboxResources'}
        egress:
          allOf:
            - $ref: '#/components/schemas/SandboxEgressConfig'
          description: |
            Network egress policy for the agent's backing sandbox. Omit for the
            secure default (deny-all). Use allow_list with allow rules to permit
            specific destinations (e.g. the model provider, git, registries).
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      description: |
        Request to update a running agent's CPU/memory sizing and/or network
        egress rules. At least one of `resources` or `egress` must be provided.
      properties:
        resources:
          allOf:
            - $ref: '#/components/schemas/SandboxResources'
          description: |
            New cpu/memory sizing, resized in place on the running sandbox. Only
            the fields provided change. disk_gb is not resizable in place and is
            rejected if supplied with a different value.
        egress:
          allOf:
            - $ref: '#/components/schemas/SandboxEgressConfig'
          description: |
            Network egress policy update for the agent's backing sandbox.
    AgentListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Agent'}}
        total: {type: integer}
        page: {type: integer}
        limit: {type: integer}
    AgentTemplate:
      type: object
      required: [id, name, description, category, status, ui, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ag-[a-zA-Z0-9-]+$'
        name: {type: string}
        description: {type: string}
        icon:
          type: string
          nullable: true
          description: "Display icon for the template (e.g. an SVG document) served as a string; null when the template has no icon."
        category: {type: string, description: "Template category (e.g. coding)."}
        status: {type: string, enum: [active, deprecated, disabled]}
        agent_version: {type: string, nullable: true, description: "Version of the packaged agent binary."}
        ui:
          type: object
          additionalProperties: true
          description: UI/drive declaration (e.g. {"mode":"tui"} or {"mode":"web","port":8080}).
        config_schema:
          type: object
          additionalProperties: true
          description: JSON-schema-like description of the config this template accepts.
        default_resources:
          allOf:
            - $ref: '#/components/schemas/SandboxResources'
          nullable: true
          description: |
            Recommended default sizing for agents of this template. An agent
            inherits these when the create request omits the corresponding
            field; caller-supplied resources take precedence. Null/omitted fields
            fall back to the platform default.
        default_egress:
          allOf:
            - $ref: '#/components/schemas/SandboxEgressConfig'
          nullable: true
          description: |
            Minimal least-privilege egress allow-list the agent needs (its model
            provider + toolchain). An agent inherits this when the create request
            omits egress; caller-supplied egress takes precedence. Null falls
            back to deny-all.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentTemplateListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentTemplate'}}
        total: {type: integer}
        page: {type: integer}
        limit: {type: integer}
tags: []
