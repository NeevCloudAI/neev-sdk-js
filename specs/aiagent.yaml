  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/rollback:
    post:
      tags: [Snapshots]
      summary: Rollback a sandbox from a snapshot
      description: |
        Same-sandbox rollback. Stops the sandbox's processes, replaces FS+memory
        with the snapshot's state, and restarts. The sandbox keeps its UUID,
        name, and network identity. Destructive — current state is overwritten
        and not auto-archived.
      operationId: rollbackSandbox
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            // A snapshot must be Ready before it can be restored.
            const snapshot = await sandbox.snapshot({ name: "my-snap", waitUntilReady: true });
            await sandbox.rollback(snapshot.id);
            await sandbox.waitUntilReady();
        - lang: Python
          source: |
            import time

            from neevai import NeevAI, SnapshotStatus

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            snapshot = sandbox.snapshot({"name": "my-snap"})
            # Snapshots start Pending; wait until Ready before restoring.
            while neev.sandboxes.get_snapshot(snapshot.id).status != SnapshotStatus.Ready:
                time.sleep(2)
            sandbox.rollback(snapshot.id)
            sandbox.wait_until_ready()
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackSandboxRequest'}
      responses:
        "200":
          description: Sandbox rollback accepted; check `phase` for progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

