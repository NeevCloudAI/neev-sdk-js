openapi: 3.0.3
info:
  title: AI Agent Service API
  description: |
    Manages sandboxes for the AI Supercloud platform. v1beta1 scope covers
    sandbox lifecycle (create, list, get, delete, pause/resume), live-health
    metrics, and memory snapshots (create, list, get, delete, rollback, fork,
    restore create).
  version: 0.2.0
servers:
  - url: https://api.{env}.ai.neevcloud.com/agent
    description: Consolidated public API gateway
    variables:
      env:
        default: dev
        enum:
          - stg
          - dev
  - url: http://localhost:7011
    description: Local Development
security:
  - BearerAuth: []
paths:
  # Sandbox lifecycle: create, list, get, delete, pause, resume, metrics.
  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes:
    get:
      tags: [Sandboxes]
      summary: List sandboxes in a project
      description: Return the list of sandboxes in a project.
      operationId: listSandboxes
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const page = await neev.sandboxes.list();
            for (const s of page.items) console.log(s.id, s.phase);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            page = neev.sandboxes.list()
            for s in page.items:
                print(s.id, s.phase)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/SandboxNameSearch'}
        - name: status
          in: query
          required: false
          description: Filter by lifecycle phase.
          schema:
            type: string
            enum: [Pending, Ready, NotReady, Unknown, Pausing, Paused, RestoreFailed]
        - {$ref: '#/components/parameters/SandboxIDFilter'}
      responses:
        "200":
          description: Paginated list of sandboxes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxListResponse'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/InternalServerError'}
    post:
      tags: [Sandboxes]
      summary: Create a sandbox
      description: Create from a catalogue template or BYOI image; set exactly one of `sandbox_template_id` or `image`.
      operationId: createSandbox
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            console.log(sandbox.id, sandbox.phase);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            print(sandbox.id, sandbox.phase)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSandboxRequest'}
      responses:
        "201":
          description: Sandbox accepted; may still be provisioning (check `phase`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}:
    get:
      tags: [Sandboxes]
      summary: Get a sandbox by ID
      operationId: getSandbox
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const created = await neev.sandboxes.create({});
            const sandbox = await neev.sandboxes.get(created.id);
            console.log(sandbox.phase, sandbox.connectUrl);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            created = neev.sandboxes.create({})
            sandbox = neev.sandboxes.get(created.id)
            print(sandbox.phase, sandbox.connect_url)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      responses:
        "200":
          description: Sandbox details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [Sandboxes]
      summary: Delete a sandbox
      description: |
        Permanently deletes the sandbox and all associated snapshots. This operation
        cannot be undone. All manual snapshots attached to this sandbox are permanently
        deleted as part of the same operation; their stored data is reclaimed
        automatically.
      operationId: deleteSandbox
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await neev.sandboxes.delete(sandbox.id);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            neev.sandboxes.delete(sandbox.id)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      responses:
        "204": {description: Sandbox and all associated snapshots deleted}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}
    patch:
      tags: [Sandboxes]
      summary: Update a sandbox in place
      description: |
        Updates mutable fields of a sandbox without restarting it. `resources` (cpu/memory) are resized
        in place on the running sandbox. Disk is not resizable in place.
        Fields omitted from the body are left unchanged.
      operationId: updateSandbox
      x-codeSamples:
        - lang: cURL
          label: Update resources
          source: |
            curl -X PATCH "$BASE_URL/api/v1beta1/orgs/$NEEV_ORG_ID/projects/$NEEV_PROJECT_ID/sandboxes/$SANDBOX_ID" \
              -H "Authorization: Bearer $NEEV_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"resources": {"cpu": 2, "memory_gb": 4}}'
        - lang: cURL
          label: Update egress rules (live, no restart)
          source: |
            curl -X PATCH "$BASE_URL/api/v1beta1/orgs/$NEEV_ORG_ID/projects/$NEEV_PROJECT_ID/sandboxes/$SANDBOX_ID" \
              -H "Authorization: Bearer $NEEV_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"egress": {"mode": "allow_list", "allow": [{"host": "api.github.com"}]}}'
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSandboxRequest'}
      responses:
        "200":
          description: Updated sandbox
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/pause:
    post:
      tags: [Sandboxes]
      summary: Pause a sandbox (stop billable runtime; preserve disks)
      description: |
        When a sandbox is paused, its full state (process memory and filesystem)
        is always snapshotted before the sandbox shuts down, so that when it is
        resumed it can instantly restore exactly where it left off.
      operationId: pauseSandbox
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            await sandbox.pause();
            console.log(sandbox.phase, sandbox.replicas);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            sandbox.pause()
            print(sandbox.phase, sandbox.replicas)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseSandboxRequest'}
      responses:
        "200":
          description: Sandbox paused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/keepalive:
    post:
      tags: [Sandboxes]
      summary: Reset a sandbox's idle timer
      description: |
        Extends the idle window so a busy sandbox stays running without an open
        connection. Call it periodically while work is in progress, for example
        once per agent turn.
      operationId: keepaliveSandbox
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      responses:
        "200":
          description: Idle timer reset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/timeout:
    put:
      tags: [Sandboxes]
      summary: Change a sandbox's idle/lifetime windows
      operationId: updateSandboxTimeout
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSandboxTimeoutRequest'}
      responses:
        "200":
          description: Windows updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/connect-token:
    post:
      tags: [Sandboxes]
      summary: Mint a short-lived connect token for a sandbox
      operationId: createConnectToken
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      responses:
        "200":
          description: Connect-token minted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectTokenResponse'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/resume:
    post:
      tags: [Sandboxes]
      summary: Resume a paused sandbox
      description: |
        Restores a paused sandbox from its implicit memory snapshot, resuming
        the process from exactly where it left off.
      operationId: resumeSandbox
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            await sandbox.pause();
            await sandbox.resume();
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            sandbox.pause()
            sandbox.resume()
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      responses:
        "200":
          description: Sandbox resumed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/ports:
    get:
      tags: [Sandboxes]
      summary: List the ports exposed for preview URLs
      description: |
        Returns the ports currently exposed for this sandbox's preview URLs,
        each with its public preview URL. Ports are private by default — a port
        is only reachable through a preview URL after you expose it.
      operationId: listSandboxPorts
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            const ports = await sandbox.listPorts();
            console.log(ports.map((p) => p.port));
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            ports = sandbox.list_ports()
            print([p.port for p in ports])
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      responses:
        "200":
          description: Exposed ports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxPortList'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}
    post:
      tags: [Sandboxes]
      summary: Expose a port for credential-free preview URLs
      description: |
        Exposes a port so it can be reached through a public preview URL, and
        returns that URL. Exposing a port that is already exposed returns the
        same URL and makes no other change.

        The port must be between 1 and 65535. Some ports are reserved by the
        platform and cannot be exposed; requests for those are rejected.
      operationId: exposeSandboxPort
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            const port = await sandbox.exposePort(3000);
            console.log(port.preview_url);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            port = sandbox.expose_port(3000)
            print(port.preview_url)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExposePortRequest'}
      responses:
        "200":
          description: Port exposed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxPort'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/ports/{port}:
    delete:
      tags: [Sandboxes]
      summary: Revoke a previously exposed preview port
      description: |
        Stops serving a port through its preview URL. Revoking a port that is
        not currently exposed succeeds and changes nothing.
      operationId: revokeSandboxPort
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            await sandbox.exposePort(3000);
            await sandbox.revokePort(3000);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            sandbox.expose_port(3000)
            sandbox.revoke_port(3000)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
        - name: port
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 65535}
      responses:
        "204": {description: Port revoked}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  # --- Sandbox Memory Snapshots ---
  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/snapshots:
    get:
      tags: [Snapshots]
      summary: List snapshots taken from a sandbox
      description: Returns a paginated list of snapshots taken from this sandbox.
      operationId: listSandboxSnapshots
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            const page = await neev.sandboxes.listSnapshots(sandbox.id);
            console.log(page.items.map((s) => s.id));
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            snapshots = neev.sandboxes.list_snapshots(sandbox.id)
            print([s.id for s in snapshots])
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200":
          description: Paginated list of snapshots
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotListResponse'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}
    post:
      tags: [Snapshots]
      summary: Create a snapshot of a sandbox
      description: |
        Captures the full sandbox state (process memory + filesystem).
        Returns immediately with `status: Pending`; poll `GET /snapshots/{snapshot_id}`
        until `status: Ready`.
      operationId: createSandboxSnapshot
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            const snapshot = await sandbox.snapshot({ name: "my-snap", waitUntilReady: true });
            console.log(snapshot.id, snapshot.status);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            snapshot = sandbox.snapshot({"name": "my-snap"})
            print(snapshot.id, snapshot.status)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSnapshotRequest'}
      responses:
        "202":
          description: Snapshot accepted (status=Pending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/InternalServerError'}

  /api/v1beta1/orgs/{org_id}/projects/{project_id}/snapshots/{snapshot_id}:
    get:
      tags: [Snapshots]
      summary: Get snapshot metadata
      description: Returns snapshot metadata including current status and storage URI once ready.
      operationId: getSnapshot
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            const snapshot = await sandbox.snapshot({ name: "my-snap" });
            const detail = await neev.sandboxes.getSnapshot(snapshot.id);
            console.log(detail.status);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            snapshot = sandbox.snapshot({"name": "my-snap"})
            detail = neev.sandboxes.get_snapshot(snapshot.id)
            print(detail.status)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SnapshotID'}
      responses:
        "200":
          description: Snapshot details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [Snapshots]
      summary: Delete a snapshot
      description: |
        Permanently deletes the snapshot and cancels any capture still in
        progress. Its stored data is reclaimed automatically. This operation
        cannot be undone.
      operationId: deleteSnapshot
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            const snapshot = await sandbox.snapshot({ name: "my-snap" });
            await neev.sandboxes.deleteSnapshot(snapshot.id);
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            snapshot = sandbox.snapshot({"name": "my-snap"})
            neev.sandboxes.delete_snapshot(snapshot.id)
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
