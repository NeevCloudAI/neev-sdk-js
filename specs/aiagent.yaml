  /api/v1beta1/orgs/{org_id}/projects/{project_id}/sandboxes/{sandbox_id}/metrics:
    get:
      tags: [Sandboxes]
      summary: Read live health metrics for a sandbox
      description: |
        Returns the bounded metric set for one sandbox (CPU / memory / disk plus
        lifecycle and rate series). `from` / `to` / `step` are optional and
        default to the last hour; the full v1 metric set is always returned (no
        metric selector).
      operationId: getSandboxMetrics
      x-codeSamples:
        - lang: TypeScript
          source: |
            import { Neev } from "@neevcloud/sdk";

            const neev = new Neev();

            const sandbox = await neev.sandboxes.create({});
            await sandbox.waitUntilReady();
            const metrics = await sandbox.metrics();
            console.log(metrics.series.map((s) => s.metric));
        - lang: Python
          source: |
            from neevai import NeevAI

            neev = NeevAI()

            sandbox = neev.sandboxes.create({})
            sandbox.wait_until_ready()
            metrics = sandbox.metrics()
            print([s.metric for s in metrics.series])
      parameters:
        - {$ref: '#/components/parameters/OrgID'}
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/SandboxID'}
        - name: from
          in: query
          required: false
          description: Start of the window (RFC3339). Defaults to one hour before `to`.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: End of the window (RFC3339). Defaults to now.
          schema: {type: string, format: date-time}
        - name: step
          in: query
          required: false
          description: Resolution (e.g. "60s", "5m"). Server clamps to a sane range.
          schema: {type: string}
      responses:
        "200":
          description: Metric series for the sandbox
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxMetricsResponse'}
